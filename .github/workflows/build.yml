name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: |
          go mod init seven8ge
          go get golang.org/x/sys/windows
          go build -ldflags="-H windowsgui" -o seven8ge.exe
      - uses: actions/upload-artifact@v4
        with:
          name: seven8ge
          path: seven8ge.exe
