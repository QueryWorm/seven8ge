name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    - name: Build EXE
      run: |
        go mod init seven8ge || true
        go get golang.org/x/sys/windows
        go build -ldflags="-H windowsgui" -o seven8ge.exe
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: seven8ge
        path: seven8ge.exe
